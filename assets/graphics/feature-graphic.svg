<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103b65"/>
      <stop offset="50%" stop-color="#147fc1"/>
      <stop offset="100%" stop-color="#23b9d9"/>
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with subtle geometric school wave -->
  <rect width="1024" height="500" fill="url(#bannerBg)"/>
  <circle cx="900" cy="100" r="300" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="450" r="250" fill="#ffffff" opacity="0.04"/>

  <!-- Left Side: Branding & Value Proposition -->
  <g transform="translate(80, 130)">
    <!-- App Logo Icon -->
    <rect width="70" height="70" rx="18" fill="#ffffff"/>
    <text x="35" y="48" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#147fc1" text-anchor="middle">S</text>
    
    <text x="90" y="50" font-family="system-ui, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="-1">SchoolHub</text>

    <!-- Subtitle -->
    <text x="0" y="115" font-family="system-ui, sans-serif" font-weight="700" font-size="28" fill="#ffffff">Unified School Management System</text>
    
    <!-- Badges / Pillars -->
    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="17" fill="#e0f4fc" font-weight="500">
      🎓 Student &amp; Parent Portal &nbsp;•&nbsp; 👩‍🏫 Teacher Desk &nbsp;•&nbsp; 🏛️ Admin Ledger
    </text>

    <text x="0" y="205" font-family="system-ui, sans-serif" font-size="15" fill="#cbe8f7">
      Live Attendance &nbsp;|&nbsp; Instant Fee Receipts &nbsp;|&nbsp; Digital Admit Cards &nbsp;|&nbsp; Homework
    </text>
  </g>

  <!-- Right Side: Floating App Mockup Card -->
  <g transform="translate(680, 80)" filter="url(#fShadow)">
    <rect width="270" height="340" rx="24" fill="#ffffff"/>
    <rect x="0" y="0" width="270" height="60" rx="24" fill="#147fc1"/>
    <text x="25" y="38" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Class VIII-B Dashboard</text>
    
    <!-- Mini UI Cards inside mock -->
    <rect x="20" y="80" width="230" height="60" rx="12" fill="#f1f8fc"/>
    <text x="35" y="105" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#19334d">Attendance: 94%</text>
    <text x="35" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#16804e">✓ Present today</text>

    <rect x="20" y="155" width="230" height="60" rx="12" fill="#f0fdf4"/>
    <text x="35" y="180" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#166534">Admit Card: Verified</text>
    <text x="35" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Unit Test 2 Ready</text>

    <rect x="20" y="230" width="230" height="80" rx="12" fill="#f8fafc"/>
    <text x="35" y="255" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#19334d">Linear Equations</text>
    <text x="35" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Mathematics • Due Nov 10</text>
    <rect x="35" y="285" width="90" height="18" rx="6" fill="#147fc1"/>
    <text x="80" y="298" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">SUBMIT WORK</text>
  </g>
</svg>
