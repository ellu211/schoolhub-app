<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SchoolHub — Unified School Management System</title>
  
  <!-- PWA & Android Meta Tags -->
  <meta name="description" content="Unified School Management System for students, parents, teachers, and school administration.">
  <meta name="theme-color" content="#124e7f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SchoolHub">
  <meta name="application-name" content="SchoolHub">
  
  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/portals.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

  <!-- Offline Status Banner -->
  <div class="offline-banner" id="offline-indicator">
    ⚡ You are currently offline. SchoolHub is running from local cache.
  </div>

  <div class="app-wrapper">
    <!-- Desktop & Tablet Sidebar -->
    <aside class="app-sidebar">
      <div class="brand-header">
        <div class="brand-icon">🏫</div>
        <div>SchoolHub</div>
      </div>

      <div class="role-badge" id="sidebar-role-badge">ADMIN &amp; MANAGEMENT PORTAL</div>

      <!-- Quick Role Switcher in Sidebar -->
      <div style="padding: 0 8px 14px">
        <label class="muted small" style="color:#b8d3ea;display:block;margin-bottom:4px">SWITCH ROLE:</label>
        <select class="form-control" id="global-role-select" style="background:#0c3459;color:#fff;border-color:#2a5e8c;font-size:12px;padding:6px 8px">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <nav class="nav-links" id="sidebar-nav">
        <!-- Injected dynamically by App.renderNavigation() based on active role -->
      </nav>

      <div class="sidebar-footer">
        <div><strong>SchoolHub Academy</strong></div>
        <div style="margin:4px 0">v1.0.0 • Google Play Edition</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
          <button class="btn btn-sm btn-outline" style="background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.25);font-size:11px;padding:5px 8px" onclick="if(confirm('Clear all demo data and start with a fresh blank school database?')) { appStore.clearAllData(); App.setRole('admin'); location.reload(); }">
            🧹 Clear All Demo Data
          </button>
          <button class="btn btn-sm btn-outline" style="background:rgba(255,255,255,0.06);color:#b8d0e3;border-color:rgba(255,255,255,0.15);font-size:11px;padding:5px 8px" onclick="if(confirm('Load sample demo dataset for preview?')) { appStore.loadDemoData(); location.reload(); }">
            📦 Load Sample Demo Data
          </button>
          <div style="margin-top:4px">
            <a href="legal/privacy-policy.html">Privacy Policy</a>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="app-main">
      <div id="portal-root">
        <!-- Rendered dynamically by active portal (StudentPortal, TeacherPortal, AdminPortal) -->
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
    <!-- Injected dynamically by App.renderNavigation() -->
  </nav>

  <!-- JavaScript Modules & Controllers -->
  <script src="js/store.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/print.js"></script>
  <script src="js/portals/student.js"></script>
  <script src="js/portals/teacher.js"></script>
  <script src="js/portals/admin.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
